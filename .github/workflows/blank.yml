
name: Secure RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure secure RDP settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          # Enable RDP while keeping NLA enabled
          Set-ItemProperty -Path $rdpPath `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty -Path $tcpPath `
            -Name 'UserAuthentication' -Value 1 -Force

          Set-ItemProperty -Path $tcpPath `
            -Name 'SecurityLayer' -Value 2 -Force

          # Do not open RDP to all incoming network connections.
          # Configure access only through an approved private network.

      - name: Check required Tailscale secret
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Missing TAILSCALE_AUTH_KEY GitHub Actions secret.'
          }

          Write-Output 'Tailscale authentication secret is configured.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installerPath = Join-Path $env:TEMP 'tailscale.msi'
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          try {
            $process = Start-Process msiexec.exe `
              -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' `
              -Wait -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }
          }
          finally {
            Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Tailscale installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $tsExe)) {
            throw 'Tailscale executable was not found.'
          }

          Write-Output 'Tailscale is installed.'
          
