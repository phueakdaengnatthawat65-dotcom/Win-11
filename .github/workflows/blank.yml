
name: Secure Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check Windows RDP configuration
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          $rdp = Get-ItemProperty -Path $rdpPath
          $tcp = Get-ItemProperty -Path $tcpPath

          if ($rdp.fDenyTSConnections -ne 0) {
            Write-Error "RDP is disabled. Configure it on your authorized Windows host first."
            exit 1
          }

          if ($tcp.UserAuthentication -ne 1) {
            Write-Error "Network Level Authentication must remain enabled."
            exit 1
          }

          Write-Host "RDP is enabled and NLA is enabled."

      - name: Check Remote Desktop service
        shell: powershell
        run: |
          $service = Get-Service -Name TermService

          Write-Host "RDP service status: $($service.Status)"

          if ($service.Status -ne 'Running') {
            Write-Error "Remote Desktop service is not running."
            exit 1
          }

      - name: Check Tailscale connectivity
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            Write-Error "Tailscale is not installed on this host."
            exit 1
          }

          & $ts status

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unable to retrieve Tailscale status."
            exit 1
          }
          
