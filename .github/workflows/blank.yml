
name: Tailscale Connection Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tailscale-check:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer
          try {
            $process = Start-Process msiexec.exe `
              -ArgumentList "/i", $installer, "/quiet", "/norestart" `
              -Wait -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed."
            }
          }
          finally {
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure TAILSCALE_AUTH_KEY in GitHub Secrets."
          }

          & $ts up "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=gh-check-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = & $ts ip -4
          if ($LASTEXITCODE -ne 0 -or -not $ip) {
            throw "Unable to retrieve Tailscale IP."
          }

          Write-Output "Tailscale connection established."
          Write-Output "Assigned Tailscale IP: $ip"

      - name: Disconnect Tailscale
        if: always()
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $ts) {
            & $ts down
          }
          
